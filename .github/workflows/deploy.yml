name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
  LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
  # Lowercase owner is required by GHCR (image refs must be lowercase).
  IMAGE_API: ghcr.io/fatihsengorr/rfq-platform-api
  IMAGE_WEB: ghcr.io/fatihsengorr/rfq-platform-web

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma generate
      - run: pnpm lint
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - run: pnpm test

  # Phase 1 (registry migration): build images in CI and push to GHCR.
  # This runs regardless of whether the server uses them yet — the deploy
  # job below still builds locally until we cut over in Phase 2. Pushing
  # here first lets us verify images land in GHCR with zero prod risk.
  build-and-push-images:
    name: Build & Push Images (GHCR)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          # Use GitHub Actions layer cache so CI builds stay fast.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Lightsail
    # Wait for images to be in GHCR before the server tries to pull them.
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # Forward IMAGE_TAG to the remote shell so compose pins this commit.
          envs: IMAGE_TAG
          script: |
            cd ~/rfq-platform
            git pull origin main
            export IMAGE_TAG="${IMAGE_TAG}"
            # Pull pre-built images from GHCR (no build on the box). The api
            # container runs `prisma migrate deploy` on startup via its compose
            # command, so migrations apply automatically when it comes up.
            docker compose --env-file deploy/lightsail/.env.prod -f docker-compose.yml -f docker-compose.prod.yml pull api web
            docker compose --env-file deploy/lightsail/.env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
