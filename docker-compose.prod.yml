services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    # Registry migration: prod pulls a pre-built image from GHCR instead of
    # building on the box. IMAGE_TAG is the commit SHA passed by the deploy
    # job; falls back to :latest for manual runs.
    image: ghcr.io/fatihsengorr/rfq-platform-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      NEXTAUTH_URL: ${APP_WEB_BASE_URL}
      NEXTAUTH_SECRET: ${AUTH_JWT_SECRET}
      # Server-side error capture — runtime env var, picked up by sentry.server.config.ts
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  api:
    image: ghcr.io/fatihsengorr/rfq-platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./deploy/lightsail/.env.prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c "./node_modules/.bin/prisma migrate deploy --schema ./prisma/schema.prisma && node dist/main.js"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
